# CI — runs on every push and pull request targeting main.
#
# Jobs:
#   changes        — path-filter gate: decides whether Rust files changed
#   fmt            — cargo fmt --check (whole workspace)
#   clippy         — cargo clippy -D warnings (whole workspace)
#   deny           — cargo deny check (requires deny.toml at repo root)
#   test           — cargo nextest run (whole workspace)
#   build          — compile-only matrix across ubuntu / macOS / Windows
#
# Path-aware gating
# -----------------
# The Rust jobs (fmt/clippy/deny/test/build) are the expensive part of CI and
# are pointless when a PR only touches the website (site/**) or other non-Rust
# files. To avoid wasting runner minutes we detect whether any Rust-relevant
# path changed and skip the expensive STEPS when it did not.
#
# IMPORTANT — why we gate steps and NOT the jobs themselves:
#   fmt/clippy/deny/test/build are configured as REQUIRED status checks in
#   branch protection. If we skipped a required job with a job-level `if:`,
#   GitHub reports that check as "skipped" — and a required check that never
#   reports success leaves the PR's merge button blocked forever ("Expected —
#   Waiting for status to be reported"). To keep the contract intact, every
#   Rust job ALWAYS runs and ALWAYS completes successfully; only its expensive
#   inner steps are guarded by `if: needs.changes.outputs.rust == 'true'`.
#   When Rust is untouched the job is a near-instant no-op that reports green,
#   so required checks are satisfied without doing real work.
#
# SHA pins should be kept current; enable Dependabot for automatic updates.
# See .github/dependabot.yml (not included here).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Change detection — outputs `rust=true` when the push/PR touches anything
  # that could affect Rust build, lint, licence or test results. The Rust jobs
  # below consume this output to decide whether to run their expensive steps.
  #
  # Conservative by design: workflow files are treated as Rust-affecting so a
  # change to CI/release/security automation always re-runs the full suite.
  # ──────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      # 'true' (string) when any Rust-relevant path changed, 'false' otherwise.
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          # On push events paths-filter diffs against the previous commit; on
          # pull_request it diffs against the PR base — both correct here.
          filters: |
            rust:
              # Rust sources anywhere in the workspace (crates/ and any future
              # top-level src/, build.rs, etc.).
              - '**/*.rs'
              # Cargo manifests and the lockfile (dependency / metadata changes).
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              # Cargo / toolchain configuration that alters how Rust builds.
              - '.cargo/**'
              - 'rust-toolchain'
              - 'rust-toolchain.toml'
              # nextest profile config lives under .config/ and changes test runs.
              - '.config/**'
              # cargo-deny policy.
              - 'deny.toml'
              # Coverage configuration consumed by the test job.
              - 'codecov.yml'
              - 'codecov.toml'
              # Build orchestration.
              - 'Makefile'
              # Conservative: any workflow change re-runs the full Rust suite so
              # CI logic changes are always validated against the real jobs.
              - '.github/workflows/**'

  # ──────────────────────────────────────────────────────────────────────────
  # Format check — no system deps needed (rustfmt only reads token streams).
  # ──────────────────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust stable + rustfmt
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check workspace formatting
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all --check

  # ──────────────────────────────────────────────────────────────────────────
  # Clippy — GTK4 headers are required because gtk4-rs proc-macros expand
  # against the installed headers at compile time.
  # ──────────────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install GTK4 and libadwaita dev headers
        if: needs.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config

      - name: Install Rust stable + clippy
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo registry and build artefacts
        if: needs.changes.outputs.rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-

      - name: Run Clippy — deny all warnings
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ──────────────────────────────────────────────────────────────────────────
  # Cargo Deny — validates licences, bans, advisories, and allowed sources
  # as defined in deny.toml at the repository root.
  # ──────────────────────────────────────────────────────────────────────────
  deny:
    name: Cargo Deny
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust stable
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable

      - name: Install cargo-deny
        if: needs.changes.outputs.rust == 'true'
        run: cargo install cargo-deny --locked

      - name: Run cargo deny check
        if: needs.changes.outputs.rust == 'true'
        run: cargo deny check

  # ──────────────────────────────────────────────────────────────────────────
  # Tests — cargo nextest for structured output; cargo-llvm-cov for coverage.
  # GTK4 headers are required for compilation; tests that need a display
  # server are expected to be gated behind #[cfg(test)] feature flags or
  # skipped via nextest filters.
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    needs: changes
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout repository
        if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install GTK4 and libadwaita dev headers
        if: needs.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config

      # llvm-tools-preview is required by cargo-llvm-cov for instrumentation.
      - name: Install Rust stable + llvm-tools
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Cargo registry and build artefacts
        if: needs.changes.outputs.rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Install cargo-nextest and cargo-llvm-cov
        if: needs.changes.outputs.rust == 'true'
        run: |
          curl -LsSf https://get.nexte.st/latest/linux \
            | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          cargo install cargo-llvm-cov --locked

      # Run tests under llvm-cov instrumentation; --profile ci activates the
      # nextest CI profile which emits JUnit XML alongside the LCOV report.
      - name: Run test suite with coverage
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo llvm-cov nextest \
            --workspace \
            --locked \
            --lcov \
            --output-path lcov.info \
            --profile ci

      - name: Upload coverage to Codecov
        # Also requires rust changes — no coverage is produced otherwise.
        if: ${{ needs.changes.outputs.rust == 'true' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

      # Upload JUnit test results so Codecov can display per-test analytics.
      # Runs even when tests fail so failures are visible in the Codecov UI.
      # Dependabot PRs do not receive repository secrets, so skip Codecov
      # uploads when the token is unavailable.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: target/nextest/ci/test-results.xml
          report_type: test_results
          fail_ci_if_error: true

  # ──────────────────────────────────────────────────────────────────────────
  # Cross-platform compile check — verifies the workspace builds on every
  # supported OS. Tests are intentionally excluded; GTK4 requires a running
  # display server, which is not available on most CI runners.
  #
  # Windows uses MSYS2/UCRT64 (MinGW) for GTK4 headers and the gnu Rust
  # target, avoiding the MSVC + gvsbuild complexity in a compile-only job.
  # The release workflow uses gvsbuild + MSVC for the actual release binary.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build / ${{ matrix.os }}
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          # GNU target so we can link against MSYS2/UCRT64 GTK4 libraries.
          - os: windows-latest
            rust_target: x86_64-pc-windows-gnu

    # NOTE: each matrix leg is its own required check ("Build / <os>"), so every
    # leg must still run and report green even when Rust is untouched. Steps are
    # therefore individually gated on needs.changes.outputs.rust; the OS-specific
    # steps additionally keep their runner.os guard.
    steps:
      - name: Checkout repository
        if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ── System dependencies ─────────────────────────────────────────────

      - name: Install GTK4 and libadwaita (Ubuntu)
        if: needs.changes.outputs.rust == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config

      - name: Install GTK4 and libadwaita (macOS)
        if: needs.changes.outputs.rust == 'true' && runner.os == 'macOS'
        run: brew install gtk4 libadwaita pkg-config

      # Windows: install pre-built GTK4 packages from MSYS2/UCRT64.
      # This is fast (~2 min) and avoids building from source.
      # pkg-config is provided by the mingw-w64-ucrt-x86_64-pkgconf package.
      - name: Install GTK4 and libadwaita (Windows via MSYS2)
        if: needs.changes.outputs.rust == 'true' && runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Configure MSYS2 environment variables (Windows)
        if: needs.changes.outputs.rust == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $msys2 = "${{ steps.msys2.outputs.msys2-location }}"
          $ucrt64 = Join-Path $msys2 "ucrt64"
          # Add the UCRT64 bin dir to PATH via GITHUB_PATH (correct mechanism
          # for PATH in GHA; GITHUB_ENV PATH= doesn't always propagate cleanly).
          "$ucrt64\bin" | Out-File -Append $env:GITHUB_PATH
          # Point pkg-config at the UCRT64 package metadata.
          "PKG_CONFIG_PATH=$ucrt64\lib\pkgconfig;$ucrt64\share\pkgconfig" | Out-File -Append $env:GITHUB_ENV
          # MSYS2 ships pkgconf.exe, not pkg-config.exe; set PKG_CONFIG so
          # Cargo build scripts find it by full path regardless of naming.
          "PKG_CONFIG=$ucrt64\bin\pkgconf.exe"          | Out-File -Append $env:GITHUB_ENV
          # Host is msvc, target is gnu — tell pkg-config cross-compile is fine.
          "PKG_CONFIG_ALLOW_CROSS=1"                    | Out-File -Append $env:GITHUB_ENV
          # Use the same UCRT64 GNU linker as the GTK import libraries.
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$ucrt64\bin\gcc.exe" | Out-File -Append $env:GITHUB_ENV

      - name: Verify MSYS2 pkg-config tools (Windows)
        if: needs.changes.outputs.rust == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path $env:PKG_CONFIG)) {
            throw "pkgconf.exe was not found at $env:PKG_CONFIG"
          }
          if (-not (Test-Path $env:CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER)) {
            throw "gcc.exe was not found at $env:CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER"
          }
          & "$env:PKG_CONFIG" --version
          & "$env:PKG_CONFIG" --modversion glib-2.0 gtk4 libadwaita-1

      # ── Rust toolchain ───────────────────────────────────────────────────

      - name: Install Rust stable
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo registry and build artefacts
        if: needs.changes.outputs.rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Build workspace (compile check only)
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            cargo build --workspace --locked --target ${{ matrix.rust_target }}
          else
            cargo build --workspace --locked
          fi
