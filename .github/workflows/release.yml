# Release — triggered when a tag matching v*.*.* is pushed.
#
# Pipeline:
#   build    — cross-compile release binaries for all 5 targets + SHA256 checksums
#   release  — collect artefacts, create GitHub Release, attach all files
#   winget   — update the Windows Package Manager manifest (vedantmgoyal9/winget-releaser)
#   homebrew — open a PR against the Homebrew cask tap (birnio/homebrew-birnio)
#              that pins the new version + both macOS SHA256 checksums
#
# Required secrets:
#   WINGET_TOKEN   — PAT with write access to the winget-pkgs community repo
#   HOMEBREW_TOKEN — fine-grained PAT scoped ONLY to birnio/homebrew-birnio with
#                    "Contents: write" and "Pull requests: write". Used to push a
#                    branch and open a PR against the tap's protected default
#                    branch (we never push to the tap's main directly).
#
# SHA pins should be kept current; enable Dependabot for automatic updates.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always
  # Crate that produces the final binary.
  UI_CRATE: birnio-ui-gtk
  # Name of the produced executable (without extension).
  BINARY_NAME: birnio

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Build release binaries for all supported targets.
  #
  # Linux x86_64      — native build on ubuntu-latest
  # Linux aarch64     — cross-compiled via `cross` on ubuntu-latest
  #                     NOTE: the default cross Docker images do not include
  #                     GTK4 / libadwaita headers. A custom Cross.toml that
  #                     points to an image with those headers pre-installed is
  #                     required. See https://github.com/cross-rs/cross.
  # macOS x86_64      — native build on macos-13 (Intel runner)
  # macOS aarch64     — native build on macos-latest (Apple Silicon runner)
  # Windows x86_64    — native MSVC build on windows-latest via gvsbuild
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false

          # aarch64-unknown-linux-gnu: disabled until a custom cross Docker image
          # with GTK4/libadwaita aarch64 headers is available. Track in an issue.

          - target: x86_64-apple-darwin
            os: macos-15-intel  # Intel runner; supported through Aug 2027
            use_cross: false

          - target: aarch64-apple-darwin
            os: macos-latest  # Apple Silicon; builds natively
            use_cross: false

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ── System dependencies (skipped for cross targets; handled in container) ──

      - name: Install GTK4 and libadwaita (Ubuntu native)
        if: runner.os == 'Linux' && !matrix.use_cross
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config

      - name: Install GTK4 and libadwaita (macOS)
        if: runner.os == 'macOS'
        run: brew install gtk4 libadwaita pkg-config

      # Windows: GTK4 built via gvsbuild produces MSVC-compatible artefacts.
      # The result is cached; the first cold run takes ~30 minutes.
      - name: Restore gvsbuild cache (Windows)
        if: runner.os == 'Windows'
        id: gvsbuild-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\gtk-build
          key: gvsbuild-gtk4-libadwaita-x64-release

      - name: Build GTK4 via gvsbuild (Windows — cache miss only)
        if: runner.os == 'Windows' && steps.gvsbuild-cache.outputs.cache-hit != 'true'
        run: |
          pip install gvsbuild
          # --vs-ver 18 targets Visual Studio 2026; update if the runner image changes.
          gvsbuild build gtk4 libadwaita --vs-ver 18

      - name: Configure GTK4 environment variables (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = "C:\gtk-build\gtk\x64\release"
          "PKG_CONFIG_PATH=$prefix\lib\pkgconfig" | Out-File -Append $env:GITHUB_ENV
          "PATH=$prefix\bin;$env:PATH"            | Out-File -Append $env:GITHUB_ENV
          "LIB=$prefix\lib;$env:LIB"              | Out-File -Append $env:GITHUB_ENV

      - name: Install pkg-config shim (Windows)
        if: runner.os == 'Windows'
        run: choco install pkgconfiglite -y

      # ── Rust toolchain ───────────────────────────────────────────────────

      - name: Install Rust stable for ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-${{ matrix.target }}-

      # `cross` is only installed when needed; it pulls a Docker image that
      # includes the cross-compilation toolchain for the target triple.
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      # ── Compile ──────────────────────────────────────────────────────────

      - name: Build release binary (native)
        if: ${{ !matrix.use_cross }}
        run: >
          cargo build
          --locked
          --release
          --target ${{ matrix.target }}
          -p ${{ env.UI_CRATE }}

      - name: Build release binary (cross)
        if: matrix.use_cross
        run: >
          cross build
          --locked
          --release
          --target ${{ matrix.target }}
          -p ${{ env.UI_CRATE }}

      # ── Package ──────────────────────────────────────────────────────────

      # Determine the platform-specific filename for the compiled binary.
      - name: Resolve binary filename
        id: bin
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "name=${{ env.BINARY_NAME }}.exe" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ env.BINARY_NAME }}" >> "$GITHUB_OUTPUT"
          fi

      # Rename the binary to include the target triple so all artefacts have
      # unique names when collected in the release job.
      - name: Rename binary to include target triple
        shell: bash
        run: |
          ext="${{ runner.os == 'Windows' && '.exe' || '' }}"
          src="target/${{ matrix.target }}/release/${{ steps.bin.outputs.name }}"
          dst="${{ env.BINARY_NAME }}-${{ matrix.target }}${ext}"
          cp "$src" "$dst"
          echo "ARTIFACT=$dst" >> "$GITHUB_ENV"

      # Generate a per-binary SHA256 checksum. These are later concatenated
      # into a single SHA256SUMS.txt file in the release job.
      - name: Generate SHA256 checksum
        shell: bash
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARTIFACT" > "${ARTIFACT}.sha256"
          else
            # macOS ships shasum instead of sha256sum
            shasum -a 256 "$ARTIFACT" > "${ARTIFACT}.sha256"
          fi

      - name: Upload binary and checksum as workflow artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
          if-no-files-found: error
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # Collect all binaries and create the GitHub Release.
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create releases and upload assets
    steps:
      - name: Download all build artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true  # flatten subdirectories into a single directory

      - name: List downloaded artefacts
        run: ls -lh artifacts/

      # Merge the individual per-binary .sha256 files into one canonical file.
      - name: Combine checksums into SHA256SUMS.txt
        run: cat artifacts/*.sha256 > artifacts/SHA256SUMS.txt

      # The tag name (e.g. v1.2.3) is available via github.ref_name.
      # generate_release_notes pulls from merged PRs and commit history.
      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/${{ env.BINARY_NAME }}-*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true

  # ──────────────────────────────────────────────────────────────────────────
  # Update the Windows Package Manager (winget) manifest.
  # Requires WINGET_TOKEN secret: a PAT with write access to the
  # microsoft/winget-pkgs community repository.
  # ──────────────────────────────────────────────────────────────────────────
  winget:
    name: Update winget manifest
    needs: release
    runs-on: windows-latest
    steps:
      - name: Submit new version to winget
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2 (verify SHA)
        with:
          # The package identifier as registered in the winget-pkgs repository.
          identifier: Birnio.Birnio
          # PAT with write access to the winget community repository.
          token: ${{ secrets.WINGET_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # Open a PR against the Homebrew cask tap (birnio/homebrew-birnio) that pins
  # the released version and both macOS SHA256 checksums.
  #
  # birnio/homebrew-birnio is a CASK tap, so we rewrite Casks/birnio.rb to the
  # pinned shape (real version + arm/intel sha256) rather than bumping a formula.
  #
  # The tap's default branch is protected, so we never push to it directly:
  # this job pushes a release branch to the tap and opens a PR via the gh CLI.
  #
  # Requires HOMEBREW_TOKEN secret: a fine-grained PAT scoped only to
  # birnio/homebrew-birnio with "Contents: write" and "Pull requests: write".
  # ──────────────────────────────────────────────────────────────────────────
  homebrew:
    name: Update Homebrew cask
    needs: release
    runs-on: ubuntu-latest
    # This job touches no birnio/birnio contents; all writes go to the tap repo
    # via HOMEBREW_TOKEN, so the default GITHUB_TOKEN needs no permissions here.
    permissions: {}
    steps:
      # Derive the version (tag without the leading "v") and fetch the two macOS
      # SHA256 values from the release's .sha256 assets. Each .sha256 file has the
      # form "<hex>  <filename>"; we keep only the leading hex digest.
      - name: Resolve version and macOS checksums
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          download() {
            gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --pattern "$1" --output - 2>/dev/null
          }

          intel_sha="$(download 'birnio-x86_64-apple-darwin.sha256' | awk '{print $1}')"
          arm_sha="$(download 'birnio-aarch64-apple-darwin.sha256' | awk '{print $1}')"

          # Fail loudly rather than write a placeholder checksum into the cask.
          for v in "$intel_sha" "$arm_sha"; do
            if [[ ! "$v" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Could not resolve a 64-char SHA256 from release assets (got '$v')."
              exit 1
            fi
          done

          echo "intel_sha=$intel_sha" >> "$GITHUB_OUTPUT"
          echo "arm_sha=$arm_sha" >> "$GITHUB_OUTPUT"

      # Check out the tap repo (not birnio/birnio) using the scoped tap token.
      - name: Checkout Homebrew tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: birnio/homebrew-birnio
          token: ${{ secrets.HOMEBREW_TOKEN }}
          path: tap

      # Rewrite Casks/birnio.rb to the pinned shape. Heredoc, not sed, so the
      # whole file is deterministic regardless of its previous contents.
      - name: Write pinned cask
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ARM_SHA: ${{ steps.meta.outputs.arm_sha }}
          INTEL_SHA: ${{ steps.meta.outputs.intel_sha }}
        run: |
          set -euo pipefail
          mkdir -p tap/Casks
          cat > tap/Casks/birnio.rb <<EOF
          cask "birnio" do
            arch arm: "aarch64", intel: "x86_64"

            version "${VERSION}"
            sha256 arm: "${ARM_SHA}", intel: "${INTEL_SHA}"

            url "https://github.com/birnio/birnio/releases/download/v#{version}/birnio-#{arch}-apple-darwin"
          end
          EOF
          echo "----- Casks/birnio.rb -----"
          cat tap/Casks/birnio.rb

      # Push a branch to the tap and open a PR against its default branch.
      # We never push to the tap's protected main directly.
      - name: Open pull request against the tap
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          branch="birnio-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # If nothing changed (re-run of the same tag), exit cleanly.
          if git diff --quiet -- Casks/birnio.rb; then
            echo "Cask already pinned to ${VERSION}; nothing to do."
            exit 0
          fi

          git switch -C "$branch"
          git add Casks/birnio.rb
          git commit -m "birnio ${VERSION}"
          git push --force-with-lease --set-upstream origin "$branch"

          # Reuse an existing open PR for this branch if there is one.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "birnio ${VERSION}" \
              --body "Automated cask update for birnio ${VERSION}. Pins \`version\` and both macOS \`sha256\` checksums. Opened by the birnio/birnio release workflow." \
              --base "$(gh repo view --json defaultBranchRef --jq '.defaultBranchRef.name')" \
              --head "$branch"
          else
            echo "An open PR for $branch already exists; updated its branch."
          fi
