[workspace]
members = [
    "crates/birnio-core",
    "crates/birnio-http",
    "crates/birnio-storage",
    "crates/birnio-import",
    "crates/birnio-ui-gtk",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/birnio/birnio"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
